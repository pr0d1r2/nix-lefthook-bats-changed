# Repo-local checks carried through from vendored lefthook.yml (#126).
---

pre-commit:
  commands:
    bats-changed:
      glob: "*.{sh,bats}"
      run: timeout ${LEFTHOOK_BATS_CHANGED_TIMEOUT:-120} lefthook-bats-changed {staged_files}


pre-push:
  commands:
    bats-changed:
      glob: "*.{sh,bats}"
      run: timeout ${LEFTHOOK_BATS_CHANGED_TIMEOUT:-120} lefthook-bats-changed {push_files}
